<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>
    <link rel="stylesheet" href="/css/inventory.css" />
    <link rel="stylesheet" href="/css/notify.css" />
  </head>

  <body>
    <div class="layout-wrapper">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="sidebar-brand">Forgot-It Locker</h2>
        <nav class="sidebar-nav">
          <a href="index.html" class="active">Inventory</a>
          <a href="/admin/orders.html">Orders</a>
          <a href="/admin/scanner.html">QR Scanner</a>
          <a href="/index.html">Exit</a>
        </nav>
      </aside>

      <!-- MAIN CONTAINER -->
      <main class="app-container">
        <!-- HEADER CONTAINER -->
        <div class="header-container">
          <h1>Inventory Management</h1>
        </div>

        <!-- EDITOR SECTION (Form + Card Simulation) -->
        <div class="editor-section">
          <!-- INVENTORY FORM (Vertical, always visible) -->
          <form id="item-form">
            <input
              type="text"
              id="item-name"
              placeholder="Item Name"
              required
            />
            <input type="file" id="item-image" accept="image/*" required />
            <input
              type="text"
              id="item-description"
              placeholder="Item Description"
              required
            />
            <input
              type="number"
              id="item-quantity"
              placeholder="Item Stock Quantity"
              min="0"
              required
            />
            <input
              type="number"
              id="item-price"
              placeholder="Item Price"
              min="0"
              step="0.01"
              required
            />
            <select id="item-category" required>
              <option value="" disabled selected>Select Item Category</option>
              <option value="School Supplies">School Supplies</option>
              <option value="Personal Essentials">Personal Essentials</option>
              <option value="Hygiene Products">Hygiene Products</option>
            </select>
            <select id="item-type" required>
              <option value="" disabled selected>
                Select Transaction Type
              </option>
              <option value="Purchase">For Purchase Only</option>
              <option value="Rent">For Rent Only</option>
            </select>

            <!-- FORM ACTIONS (Clear + Save) -->
            <div class="form-actions">
              <button type="button" id="clear-btn">Clear</button>
              <button type="submit" id="submit-btn">Add Item</button>
            </div>
          </form>

          <!-- CARD SIMULATION PREVIEW -->
          <div class="card-preview">
            <div class="card-image-wrapper">
              <img
                id="preview-img"
                src=""
                alt="Item Preview"
                style="display: none"
              />
              <div id="preview-placeholder">No Image Selected</div>
            </div>

            <!-- Compressed Data Section -->
            <div class="card-details">
              <h3 id="preview-title">Item Name</h3>
              <p id="preview-desc">Item Description</p>
              <p id="preview-category">Item Category</p>
              <div class="preview-price" id="preview-price">₱0.00</div>
            </div>

            <button type="button" class="add-to-cart-btn">Add to Cart</button>
          </div>
        </div>
        <!-- End Editor Section -->

        <!-- INVENTORY TABLE -->
        <div class="table-responsive">
          <table class="inventory-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Name</th>
                <th>Description</th>
                <th>Stock</th>
                <th>Price</th>
                <th>Category</th>
                <th>Type</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="items"></tbody>
          </table>
        </div>
      </main>
      <!-- End App Container -->
    </div>
    <!-- End Layout Wrapper -->

    <!-- ACTION MENU (Dropdown) -->
    <div id="action-menu" class="action-menu">
      <button type="button" id="edit-btn">Edit Item</button>
      <button type="button" id="delete-btn">Delete Item</button>
      <button type="button" id="cancel-action-btn">Cancel</button>
    </div>

    <!-- JAVASCRIPT -->
    <script src="/js/notify.js"></script>
    <script src="/js/script.js"></script>
  </body>
</html>
