<!doctype html>
<html lang="en">
  <head>
    <script src="/js/sidebar-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner | Forgot-It Locker</title>
    <link rel="stylesheet" href="/css/orders.css" />
    <link rel="stylesheet" href="/css/notify.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <!-- HTML5-QRCode Library CDN (pinned version) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>

  <body>
    <div class="layout-wrapper">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-brand">
            <span class="sidebar-label">Forgot-It Locker</span>
          </h2>
          <button
            type="button"
            id="sidebar-collapse-btn"
            class="sidebar-toggle"
            aria-label="Retract sidebar"
          >
            &lt;
          </button>
          <button
            type="button"
            id="sidebar-expand-btn"
            class="sidebar-toggle"
            aria-label="Expand sidebar"
          >
            &gt;
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="/admin/inventory.html"
            ><img
              src="/images/inventory.png"
              alt=""
              class="sidebar-icon"
            /><span class="sidebar-label">Inventory</span></a
          >
          <a href="/admin/orders.html"
            ><img src="/images/orders.png" alt="" class="sidebar-icon" /><span
              class="sidebar-label"
              >Orders</span
            ></a
          >
          <a href="/admin/scanner.html" class="active"
            ><img src="/images/scanner.png" alt="" class="sidebar-icon" /><span
              class="sidebar-label"
              >QR Scanner</span
            ></a
          >
          <a href="/index.html"
            ><img src="/images/exit.png" alt="" class="sidebar-icon" /><span
              class="sidebar-label"
              >Exit</span
            ></a
          >
        </nav>
      </aside>
      <script src="/js/sidebar.js"></script>

      <!-- MAIN CONTAINER -->
      <main class="app-container">
        <div class="header-container">
          <h1>QR Scanner</h1>
          <p class="subtitle">
            Scan QR codes to process student orders, rentals, and returns.
          </p>
        </div>

        <!-- QR SCANNER COMPONENT -->
        <div class="scanner-section">
          <div class="scanner-header">
            <h3>Camera Feed</h3>
            <button id="start-scan-btn" class="btn-success">
              Start Camera
            </button>
          </div>

          <div id="qr-reader-wrapper" style="display: none">
            <div id="qr-reader"></div>
            <button id="stop-scan-btn" class="btn-danger">Stop Camera</button>
          </div>

          <!-- File Upload Fallback Scanner -->
          <div class="scanner-upload">
            <label for="qr-file-input">Scan from QR Code Image File:</label>
            <input type="file" id="qr-file-input" accept="image/*" />
            <!-- Hidden helper used only for reading image files -->
            <div id="qr-file-reader" style="display: none"></div>
          </div>

          <!-- SCANNED QR INFORMATION (shown below the scanner) -->
          <div id="scanned-info-card" class="scanned-info-card">
            <h4>Scanned QR Code Information</h4>
            <div id="scanned-info-content" class="scanned-info-content"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/notify.js"></script>
    <script src="../js/scanner.js"></script>
  </body>
</html>
