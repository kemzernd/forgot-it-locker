<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Scanner | Forgot-It Locker</title>
    <link rel="stylesheet" href="/css/orders.css" />
    <link rel="stylesheet" href="/css/notify.css" />
    <!-- HTML5-QRCode Library CDN (pinned version) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>

  <body>
    <div class="layout-wrapper">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="sidebar-brand">Forgot-It Locker</h2>
        <nav class="sidebar-nav">
          <a href="/admin/inventory.html">Inventory</a>
          <a href="/admin/orders.html">Orders</a>
          <a href="/admin/scanner.html" class="active">QR Scanner</a>
          <a href="/index.html">Exit</a>
        </nav>
      </aside>

      <!-- MAIN CONTAINER -->
      <main class="app-container">
        <div class="header-container">
          <h1>QR Scanner</h1>
          <p class="subtitle">
            Scan QR codes to process student orders, rentals, and returns.
          </p>
        </div>

        <!-- QR SCANNER COMPONENT -->
        <div class="scanner-section">
          <div class="scanner-header">
            <h3>Camera Feed</h3>
            <button id="start-scan-btn" class="btn-success">
              Start Camera
            </button>
          </div>

          <div id="qr-reader-wrapper" style="display: none">
            <div id="qr-reader"></div>
            <button id="stop-scan-btn" class="btn-danger">Stop Camera</button>
          </div>

          <!-- File Upload Fallback Scanner -->
          <div class="scanner-upload">
            <label for="qr-file-input">Scan from QR Code Image File:</label>
            <input type="file" id="qr-file-input" accept="image/*" />
            <!-- Hidden helper used only for reading image files -->
            <div id="qr-file-reader" style="display: none"></div>
          </div>

          <!-- SCANNED QR INFORMATION (shown below the scanner) -->
          <div id="scanned-info-card" class="scanned-info-card">
            <h4>Scanned QR Code Information</h4>
            <div id="scanned-info-content" class="scanned-info-content"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/notify.js"></script>
    <script src="../js/scanner.js"></script>
  </body>
</html>
