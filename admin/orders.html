<!doctype html>
<html lang="en">
  <head>
    <script src="../js/sidebar-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders Management | Forgot-It Locker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="../css/orders.css" />
    <link rel="stylesheet" href="../css/notify.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
  </head>

  <body>
    <div class="layout-wrapper">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-brand">
            <span class="sidebar-label">Forgot-It Locker</span>
          </h2>
          <button
            type="button"
            id="sidebar-collapse-btn"
            class="sidebar-toggle"
            aria-label="Retract sidebar"
          >
            &lt;
          </button>
          <button
            type="button"
            id="sidebar-expand-btn"
            class="sidebar-toggle"
            aria-label="Expand sidebar"
          >
            &gt;
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="/admin/inventory.html"
            ><img
              src="../images/inventory.png"
              alt=""
              class="sidebar-icon"
            /><span class="sidebar-label">Inventory</span></a
          >
          <a href="/admin/orders.html" class="active"
            ><img src="../images/orders.png" alt="" class="sidebar-icon" /><span
              class="sidebar-label"
              >Orders</span
            ></a
          >
          <a href="/admin/scanner.html"
            ><img
              src="../images/scanner.png"
              alt=""
              class="sidebar-icon"
            /><span class="sidebar-label">QR Scanner</span></a
          >
          <a href="../index.html"
            ><img src="/images/exit.png" alt="" class="sidebar-icon" /><span
              class="sidebar-label"
              >Exit</span
            ></a
          >
        </nav>
      </aside>
      <script src="../js/sidebar.js"></script>

      <!-- MAIN CONTAINER -->
      <main class="app-container">
        <!-- HEADER CONTAINER -->
        <div class="header-container">
          <div
            class="header-row d-flex justify-content-between align-items-start flex-wrap gap-3"
          >
            <div class="header-text">
              <h1>Orders Management</h1>
              <p class="subtitle">
                Monitor student orders, rentals, and returns.
              </p>
            </div>
            <div class="header-actions d-flex align-items-center gap-2">
              <button type="button" id="delete-all-btn" class="btn-delete-all">
                Delete All Records
              </button>
              <button type="button" id="save-csv-btn" class="btn-save-csv">
                Save CSV
              </button>
            </div>
          </div>
        </div>

        <!-- ORDERS TABLE -->
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Unique ID</th>
                <th>Student Name</th>
                <th>Item(s) & Qty</th>
                <th>Pick Up Time</th>
                <th>Retrieval Time</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="orders-table-body">
              <!-- Dynamically populated by JS -->
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- DELETE ALL CONFIRMATION MODAL -->
    <div id="delete-modal" class="modal-overlay" hidden>
      <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-modal-title"
      >
        <h3 id="delete-modal-title">Delete all order records?</h3>
        <p>
          This will permanently remove every order record. This action cannot be
          undone.
        </p>
        <div class="modal-actions">
          <button type="button" id="delete-cancel-btn" class="btn-modal-cancel">
            Cancel
          </button>
          <button
            type="button"
            id="delete-confirm-btn"
            class="btn-modal-delete"
          >
            Delete All
          </button>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../js/notify.js"></script>
    <script src="../js/orders.js"></script>
  </body>
</html>
