<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Items | Forgot-It Locker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="/css/shop.css" />
    <link rel="stylesheet" href="/css/notify.css" />
  </head>
  <body>
    <!-- FIXED NAVBAR -->
    <nav class="navbar">
      <div class="navbar-container">
        <!-- Left: Brand / Header -->
        <a href="shop.html" class="nav-brand">Shop</a>

        <!-- Right: Search Bar + Burger Button + Drawer Menu -->
        <div class="nav-right">
          <!-- Filters + Search (selects sit at the left of the search bar) -->
          <div
            class="nav-filters d-flex flex-wrap align-items-center justify-content-end gap-2"
          >
            <select
              id="category-filter"
              class="filter-select"
              aria-label="Item Category"
            >
              <option value="">Item Category</option>
              <option value="School Supplies">School Supplies</option>
              <option value="Personal Essentials">Personal Essentials</option>
              <option value="Hygiene Products">Hygiene Products</option>
            </select>
            <select
              id="type-filter"
              class="filter-select"
              aria-label="Type of Transaction"
            >
              <option value="">Type of Transaction</option>
              <option value="Purchase">Purchase</option>
              <option value="Rent">Rent</option>
            </select>
            <div class="search-container">
              <input
                type="search"
                id="search-input"
                placeholder="Search items..."
              />
            </div>
          </div>

          <!-- Burger Icon (Laptop / Tablet / Mobile) -->
          <button class="burger-btn" id="burger-btn" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </button>

          <!-- Drawer Menu (80% width, 100% height off-canvas) -->
          <div class="nav-links" id="nav-links">
            <button
              class="close-menu-btn"
              id="close-menu-btn"
              aria-label="Close menu"
            >
              &times;
            </button>
            <!-- Added class="active" so it shows up green when on the shop page -->
            <a href="/index.html">Home</a>
            <a href="/student/shop.html" class="active">Items</a>
            <a href="/student/Cart.html">Cart</a>
            <a href="/admin/login.html">Admin</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Overlay Backdrop -->
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- MAIN CONTENT -->
    <div class="shop-wrapper">
      <!-- SHOP GRID CONTAINER -->
      <main class="shop-container" id="shop-container">
        <!-- JavaScript will dynamically inject the item cards here -->
      </main>
    </div>

    <script src="../js/notify.js"></script>
    <script src="../js/shop.js"></script>
  </body>
</html>
