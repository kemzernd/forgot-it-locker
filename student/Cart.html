<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Forgot-It Locker</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"
    />
    <link rel="stylesheet" href="../css/cart.css" />
    <link rel="stylesheet" href="../css/notify.css" />
  </head>
  <body>
    <!-- FIXED NAVBAR -->
    <nav class="navbar">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />

      <div class="navbar-container">
        <!-- Left: Brand / Header -->
        <a href="shop.html" class="nav-brand">Cart</a>

        <!-- Right: Search Bar & Navigation Controls -->
        <div class="nav-right">
          <!-- Filters + Search (selects sit before the search bar) -->
          <div
            class="nav-filters d-flex flex-wrap align-items-center justify-content-end gap-2"
          >
            <select
              id="category-filter"
              class="filter-select"
              aria-label="Item Category"
            >
              <option value="">Item Category</option>
              <option value="School Supplies">School Supplies</option>
              <option value="Personal Essentials">Personal Essentials</option>
              <option value="Hygiene Products">Hygiene Products</option>
            </select>
            <select
              id="type-filter"
              class="filter-select"
              aria-label="Type of Transaction"
            >
              <option value="">Type of Transaction</option>
              <option value="Purchase">Purchase</option>
              <option value="Rent">Rent</option>
            </select>
            <div class="search-container">
              <input
                type="search"
                id="search-input"
                placeholder="Search cart items..."
              />
            </div>
          </div>

          <!-- Burger Icon Label -->
          <label for="nav-toggle" class="burger-btn" aria-label="Toggle menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </label>

          <!-- Drawer Menu -->
          <div class="nav-links">
            <label
              for="nav-toggle"
              class="close-menu-btn"
              aria-label="Close menu"
              >&times;</label
            >
            <a href="../index.html">Home</a>
            <a href="shop.html">Items</a>
            <a href="cart.html" class="active">Cart</a>
            <a href="../admin/login.html">Admin</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER FOR CART ITEMS -->
    <main class="cart-wrapper">
      <h1>Your Shopping Cart</h1>
      <div class="cart-container" id="cart-container">
        <!-- Cart items dynamically rendered via JavaScript -->
      </div>
    </main>

    <!-- FIXED BOTTOM BAR -->
    <footer class="cart-footer">
      <div class="footer-container">
        <div class="cart-total-display" id="cart-total-display">
          Total: ₱0.00
        </div>
        <button type="button" class="checkout-btn" id="checkout-btn">
          Proceed Checkout
        </button>
      </div>
    </footer>

    <script src="../js/notify.js"></script>
    <script src="../js/cart.js"></script>
  </body>
</html>
